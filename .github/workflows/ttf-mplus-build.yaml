name: Build TTF-MPlus

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build packages in container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c '
            pacman -Syu --noconfirm
            pacman -S --noconfirm sudo base-devel git
            useradd -m builder
            chown -R builder:builder /workspace
            echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/builder
            sudo -u builder bash -c "
              cd ttf-mplus || { echo \"Directory ttf-mplus not found\"; exit 1; }
              makepkg --noconfirm --skipchecksums || exit 1
            "
          '

      - name: Extract version from PKGBUILD
        id: pkg_info
        run: |
          cd ttf-mplus
          PKGVER=$(grep "^pkgver=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          PKGREL=$(grep "^pkgrel=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          echo "PKGVER=$PKGVER" >> $GITHUB_ENV
          echo "PKGREL=$PKGREL" >> $GITHUB_ENV
          echo "TAG=v${PKGVER}-${PKGREL}" >> $GITHUB_ENV
          echo "Версия: $PKGVER-$PKGREL"
          echo "Тег: v${PKGVER}-${PKGREL}"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TTF-MPlus v${{ env.PKGVER }}-${{ env.PKGREL }}
          files: |
            ttf-mplus/ttf-mplus1-${{ env.PKGVER }}-${{ env.PKGREL }}-any.pkg.tar.zst
            ttf-mplus/ttf-mplus2-${{ env.PKGVER }}-${{ env.PKGREL }}-any.pkg.tar.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
