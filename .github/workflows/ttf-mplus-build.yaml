name: Build and Release TTF-MPlus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package in container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c '
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm sudo base-devel git &&
            useradd -m builder &&
            chown -R builder:builder /workspace &&
            echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/builder &&
            sudo -u builder bash -c "
              cd ttf-mplus || { echo \"Directory ttf-mplus not found\"; exit 1; }
              makepkg --noconfirm
            "
          '

      - name: Fix permissions for Git
        run: |
          sudo chown -R $(whoami) .git
          ls -la .git/config

      - name: Extract PKGVER and create Git tag
        run: |
          pkgver=$(grep "^pkgver=" ttf-mplus/PKGBUILD | cut -d= -f2)
          tag="v${pkgver}-${GITHUB_RUN_NUMBER}"
          echo "PKGVER=$pkgver" >> $GITHUB_ENV
          echo "TAG=$tag" >> $GITHUB_ENV
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TTF-MPlus v${{ env.PKGVER }}
          files: |
            ttf-mplus/ttf-mplus1-1.0.0-1-any.pkg.tar.zst
            ttf-mplus/ttf-mplus2-1.0.0-1-any.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}