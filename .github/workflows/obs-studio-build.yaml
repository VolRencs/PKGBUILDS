name: Build obs-studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Arch package
        id: build
        uses: 2m/arch-pkgbuild-builder@v1.21
        with:
          target: 'pkgbuild'
          pkgname: 'obs-studio'
          pkgbuild_dir: 'obs-studio'

      - name: Show built packages
        run: |
          echo "Packages:"
          ls -la "${{ steps.build.outputs.pkgfiles }}"

      - name: Create Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          TAG="v${{ steps.build.outputs.pkgver }}-${{ steps.build.outputs.pkgrel }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.pkgver }}-${{ steps.build.outputs.pkgrel }}
          files: ${{ steps.build.outputs.pkgfiles }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
