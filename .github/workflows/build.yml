name: Build KF6

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build"
        required: true
        type: string
        default: |
          - prison
          - kfilemetadata
          - knewstuff
          - purpose

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pkg: ${{ fromJson(github.event.inputs.package) }}

    env:
      PACKAGE_DIR: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PACKAGE_DIR="${{ env.PACKAGE_DIR }}" \
            archlinux:latest bash -c '
              pacman -Syu --noconfirm base-devel &&
              useradd -m builder &&
              chown -R builder:builder /workspace &&
              echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder &&
              su builder -c "cd \"$PACKAGE_DIR\" && makepkg -s --noconfirm"
            '

      - name: Extract package info
        run: |
          cd "$PACKAGE_DIR"
          source PKGBUILD
          FULLVER="${epoch:+$epoch:}$pkgver-$pkgrel"
          TAG="${pkgname}-v${FULLVER//:/_}"
          PKGFILE="${pkgname}-${FULLVER}-x86_64.pkg.tar.zst"
          echo "PKGNAME=$pkgname" >> $GITHUB_ENV
          echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          test -f "$PKGFILE"

      - name: Fix git ownership
        run: sudo chown -R $(whoami):$(whoami) .git

      - name: Create and push tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}" 2>/dev/null || echo "Tag exists"
          git push origin "${{ env.TAG }}" || true

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          artifacts: ${{ env.PACKAGE_DIR }}/${{ env.PKGFILE }}
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
