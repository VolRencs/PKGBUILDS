name: Build ONLYOFFICE PKGBUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup non-root user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel gtk3 gstreamer gst-plugins-base-libs \
            libxss nss nspr desktop-file-utils hicolor-icon-theme wget unzip git

      - name: Build ONLYOFFICE package
        run: |
          cd onlyoffice
          sudo -u builder makepkg -s --noconfirm

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-pkg
          path: '*.pkg.tar.zst'
