name: Build ONLYOFFICE PKGBUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup non-root user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm sudo
          useradd -m builder
          chown -R builder:builder .
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/builder

      - name: Install dependencies and build
        run: |
          sudo -u builder bash -c '
            sudo pacman -Syu --noconfirm
            sudo pacman -S --noconfirm base-devel gtk3 gstreamer gst-plugins-base-libs \
              libxss nss nspr desktop-file-utils hicolor-icon-theme wget unzip git
            cd onlyoffice || { echo "Directory onlyoffice not found"; exit 1; }
            makepkg --noconfirm
          '

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-pkg
          path: onlyoffice/*.pkg.tar.zst