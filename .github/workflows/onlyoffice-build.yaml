name: Build ONLYOFFICE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полный клон для работы с Git тегами

      - name: Install dependencies and build
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel gtk3 gstreamer gst-plugins-base-libs \
            libxss nss nspr desktop-file-utils hicolor-icon-theme wget unzip git libarchive
          cd onlyoffice
          makepkg --noconfirm

      - name: Create Git tag
        run: |
          pkgver=$(grep "^pkgver=" PKGBUILD | cut -d= -f2)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${pkgver}" -m "Release v${pkgver}"
          git push origin "v${pkgver}"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKGVER }}
          name: ONLYOFFICE v${{ env.PKGVER }}
          files: onlyoffice-9.1.0-1-x86_64.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKGVER: $(grep "^pkgver=" onlyoffice/PKGBUILD | cut -d= -f2)