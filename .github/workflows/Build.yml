name: Build PKGBUILDs

on:
  push:
    paths:
      - "**/PKGBUILD"
  workflow_dispatch:
    inputs:
      packages:
        description: "Directories to build (one per line)"
        required: true
        type: string
        default: |
          brush-settings
          cachyfetch
          libinput
          obs-studio
          onlyoffice
          prismlauncher
          git
          v2rayn-bin
      force_release:
        description: "Force release even if version is unchanged"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              PKGS=$(find . -name PKGBUILD -printf '%h\n' | sed 's|^\./||')
            else
              PKGS=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
                | grep 'PKGBUILD$' | xargs -I{} dirname {} | sed 's|^\./||')
            fi
          else
            PKGS=$(printf '%s' '${{ inputs.packages }}' | grep -v '^$')
          fi

          echo "matrix=$(echo "$PKGS" | sort -u | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        run: |
          PKGBUILD="${{ matrix.pkg }}/PKGBUILD"

          get_field() { grep -m1 "^${1}=" "$PKGBUILD" | cut -d= -f2- | tr -d "\"' "; }

          PKGBASE=$(get_field pkgbase)
          [ -z "$PKGBASE" ] && PKGBASE=$(get_field pkgname)
          PKGVER=$(get_field pkgver)
          PKGREL=$(get_field pkgrel)
          EPOCH=$(get_field epoch)
          FULLVER="${EPOCH:+${EPOCH}:}${PKGVER}-${PKGREL}"
          TAG="${PKGBASE}-v${FULLVER//:/_}"

          echo "pkgbase=$PKGBASE"  >> "$GITHUB_OUTPUT"
          echo "fullver=$FULLVER"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list "${PKGBASE}-v*" --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "prev_ver=(none)"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_BUILD=$(git show "${LAST_TAG}:${PKGBUILD}" 2>/dev/null || true)
          prev_field() { echo "$PREV_BUILD" | grep -m1 "^${1}=" | cut -d= -f2- | tr -d "\"' "; }
          PREV_EPOCH=$(prev_field epoch)
          PREV_FULLVER="${PREV_EPOCH:+${PREV_EPOCH}:}$(prev_field pkgver)-$(prev_field pkgrel)"

          echo "prev_ver=$PREV_FULLVER" >> "$GITHUB_OUTPUT"

          if [ "$FULLVER" != "$PREV_FULLVER" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.should_release == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            -e PACKAGE_DIR="${{ matrix.pkg }}" \
            archlinux:latest bash -c '
              pacman -Syu --noconfirm base-devel
              useradd -m builder
              chown -R builder:builder /workspace
              echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
              su builder -c "cd \"$PACKAGE_DIR\" && makepkg -s --noconfirm"
            '

      - name: Collect artifacts
        if: steps.version.outputs.should_release == 'true'
        id: artifact
        run: |
          FILES=$(find "${{ matrix.pkg }}" -maxdepth 1 -name "*.pkg.tar.*" ! -name "*.sig" | paste -sd,)
          [ -z "$FILES" ] && { echo "::error::No artifacts found"; exit 1; }
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          sudo chown -R "$(whoami):$(whoami)" .git
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          TAG="${{ steps.version.outputs.tag }}"
          git rev-parse "$TAG" >/dev/null 2>&1 \
            || git tag -a "$TAG" -m "Release $TAG" && git push origin "$TAG"

      - name: Release
        if: steps.version.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag:       ${{ steps.version.outputs.tag }}
          name:      "${{ steps.version.outputs.pkgbase }} ${{ steps.version.outputs.fullver }}"
          body: |
            **Package:** `${{ steps.version.outputs.pkgbase }}`
            **Version:** `${{ steps.version.outputs.fullver }}`
            **Previous:** `${{ steps.version.outputs.prev_ver }}`
          artifacts:            ${{ steps.artifact.outputs.files }}
          generateReleaseNotes: true
          skipIfReleaseExists:  true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.should_release }}" = "true" ]; then
            echo "## ✅ ${{ steps.version.outputs.pkgbase }} — released \`${{ steps.version.outputs.fullver }}\` (was \`${{ steps.version.outputs.prev_ver }}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⏭️ ${{ steps.version.outputs.pkgbase }} — skipped, version \`${{ steps.version.outputs.fullver }}\` unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi