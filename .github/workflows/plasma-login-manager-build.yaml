name: Build plasma-login-manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package in container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c '
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm sudo base-devel gcc-libs glibc kauth kcmutils kconfig kcoreaddons kdbusaddons ki18n kio kirigami kpackage \
            kservice kwindowsystem layer-shell-qt libplasma libxau pam plasma-workspace qt6-base qt6-declarative systemd-libs extra-cmake-modules git
            useradd -m builder &&
            chown -R builder:builder /workspace &&
            echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/builder &&
            sudo -u builder bash -c "
              cd plasma-login-manager || { echo \"Directory plasma-login-manager not found\"; exit 1; }
              makepkg --noconfirm
            "
          '

      - name: Fix permissions for Git
        run: |
          sudo chown -R $(whoami) .git
          ls -la .git/config

      - name: Extract PKGVER and create Git tag
        run: |
          pkgver=$(grep "^pkgver=" plasma-login-manager/PKGBUILD | cut -d= -f2)
          pkgrel=$(grep "^pkgrel=" plasma-login-manager/PKGBUILD | cut -d= -f2)
          echo "PKGVER=$pkgver" >> $GITHUB_ENV
          echo "PKGREL=$pkgrel" >> $GITHUB_ENV

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          tag="v${pkgver}-${pkgrel}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"


      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKGVER }}
          name: plasma-login-manager v${{ env.PKGVER }}
          files: plasma-login-manager/plasma-login-manager-6.5.git20251030-1-x86_64.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}