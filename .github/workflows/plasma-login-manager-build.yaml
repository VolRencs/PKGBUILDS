name: Build plasma-login-manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package in container
        id: build_pkg
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c '
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm sudo base-devel git extra-cmake-modules \
              glibc kauth kcmutils kconfig kcoreaddons kdbusaddons ki18n kio \
              kirigami kpackage kservice kwindowsystem layer-shell-qt libplasma libxau \
              pam plasma-workspace qt6-base qt6-declarative systemd-libs clang lld ninja &&
            useradd -m builder &&
            chown -R builder:builder /workspace &&
            echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/builder &&
            sudo -u builder bash -c "
              cd plasma-login-manager || { echo \"Directory not found\"; exit 1; }
              makepkg --noconfirm --needed
            "
          '

      - name: Extract package info from PKGBUILD
        id: pkg_info
        run: |
          cd plasma-login-manager

          PKGNAME=$(grep "^pkgname=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          PKGVER=$(grep "^pkgver=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          PKGREL=$(grep "^pkgrel=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          EPOCH=$(grep "^epoch=" PKGBUILD | head -1 | cut -d= -f2 | xargs)

          FULLVER="${EPOCH}:${PKGVER}-${PKGREL}"
          PKGFILE="${PKGNAME}-${EPOCH}:${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          TAGVER="v${EPOCH}_${PKGVER}-${PKGREL}"

          if [[ ! -f "$PKGFILE" ]]; then
            echo "Ошибка: пакет $PKGFILE не найден!"
            ls -la
            exit 1
          fi

          echo "PKGNAME=$PKGNAME" >> $GITHUB_ENV
          echo "FULLVER=$FULLVER" >> $GITHUB_ENV
          echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
          echo "TAG=$TAGVER" >> $GITHUB_ENV

          echo "Пакет: $PKGFILE"
          echo "Тег: v${PKGVER}-${PKGREL}"

      - name: Create and push Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          TAG="${{ env.TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует, пропускаем создание."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.PKGNAME }} ${{ env.TAG }}
          files: plasma-login-manager/${{ env.PKGFILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}