name: Build egl-wayland2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare build directory
        run: |
          mkdir -p /home/builder/gh-action
          cp -r egl-wayland2/* /home/builder/gh-action/
          chown -R nobody /home/builder/gh-action

      - name: Build package
        run: |
          cd /home/builder/gh-action
          sudo -u nobody makepkg -si --noconfirm --skipinteg --rmdeps --pkgdir /home/builder/gh-action/pkg

      - name: Extract package info from PKGBUILD
        id: pkg_info
        run: |
          cd egl-wayland2

          # Берём pkgname (работает и если это массив)
          PKGNAME=$(source PKGBUILD && echo "${pkgname[0]}")
          PKGVER=$(grep "^pkgver=" PKGBUILD | cut -d= -f2 | tr -d ' ')
          PKGREL=$(grep "^pkgrel=" PKGBUILD | cut -d= -f2 | tr -d ' ')
          EPOCH=$(grep "^epoch=" PKGBUILD | cut -d= -f2 | xargs)

          if [[ -z "$EPOCH" ]]; then
            FULLVER="${PKGVER}-${PKGREL}"
            TAG="v${PKGVER}-${PKGREL}"
          else
            FULLVER="${EPOCH}:${PKGVER}-${PKGREL}"
            TAG="v${EPOCH}_${PKGVER}-${PKGREL}"
          fi

          PKGFILE="${PKGNAME}-${FULLVER}-x86_64.pkg.tar.zst"

          echo "PKGNAME=$PKGNAME" >> $GITHUB_ENV
          echo "FULLVER=$FULLVER" >> $GITHUB_ENV
          echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

          echo "Пакет: $PKGFILE"
          echo "Тег: $TAG"
      
      - name: Create Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          TAG="${{ env.TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.PKGNAME }} ${{ env.TAG }}
          files: /home/builder/gh-action/pkg/${{ env.PKGFILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}