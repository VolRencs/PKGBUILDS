name: Build brush-settings

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package in container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c '
          pacman -Syu --noconfirm && pacman -S --noconfirm base-devel brush lsd starship fastfetch otf-comicshanns-nerd git &&
          useradd -m builder && chown -R builder:builder /workspace &&
          echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder && sudo -u builder bash -c " cd brush-settings && makepkg --noconfirm "
          '

      - name: Extract version from PKGBUILD
        id: pkg_info
        run: |
          cd brush-settings

          PKGNAME=$(grep "^pkgname=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          PKGVER=$(grep "^pkgver=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')
          PKGREL=$(grep "^pkgrel=" PKGBUILD | head -1 | cut -d= -f2 | tr -d ' ')

          PKGFILE="${PKGNAME}-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"

          if [[ ! -f "$PKGFILE" ]]; then
            echo "Ошибка: пакет $PKGFILE не найден!"
            ls -la
            exit 1
          fi

          echo "PKGNAME=$PKGNAME" >> $GITHUB_ENV
          echo "PKGVER=$PKGVER" >> $GITHUB_ENV
          echo "PKGREL=$PKGREL" >> $GITHUB_ENV
          echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
          echo "TAG=v${PKGVER}-${PKGREL}" >> $GITHUB_ENV

          echo "Пакет: $PKGFILE"
          echo "Тег: v${PKGVER}-${PKGREL}"
      
      - name: Fix .git ownership for runner user
        run: sudo chown -R $(whoami):$(whoami) .git
      
      - name: Create Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          TAG="${{ env.TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.PKGNAME }} ${{ env.TAG }}
          files: brush-settings/${{ env.PKGFILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
