name: Build Prismlauncher

on:
  workflow_dispatch:

env:
  PACKAGE_DIR: prismlauncher

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c '
            pacman -Syu --noconfirm base-devel &&
            useradd -m builder &&
            chown -R builder:builder /workspace &&
            echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder &&
            su builder -c "cd \"$PACKAGE_DIR\" && makepkg -s --noconfirm"
          '

      - name: Extract package info
        run: |
          cd $PACKAGE_DIR
          source PKGBUILD

          FULLVER="${epoch:+$epoch:}$pkgver-$pkgrel"
          PKGFILE="${pkgname}-${FULLVER}-x86_64.pkg.tar.zst"
          TAG="${pkgname}-v${FULLVER//:/_}"

          echo "PKGNAME=$pkgname" >> $GITHUB_ENV
          echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

          test -f "$PKGFILE"

      - name: Fix git ownership
        run: sudo chown -R $(whoami):$(whoami) .git

      - name: Create tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if ! git rev-parse "${{ env.TAG }}" >/dev/null 2>&1; then
            git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}"
            git push origin "${{ env.TAG }}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.PKGNAME }} ${{ env.TAG }}
          files: ${{ env.PACKAGE_DIR }}/${{ env.PKGFILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}